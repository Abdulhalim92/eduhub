<!DOCTYPE html>
<html lang="ru" class="h-full bg-[#E1EAF3]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>Платформа «ЛИНИЯ» · Управление учебными центрами</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="src/js/tailwind-config.js?v=20261123082931"></script>
  <link rel="stylesheet" href="src/css/app.css?v=20261123082931">
  <!-- общее состояние mock-данных с eduhub.html (localStorage); сброс — кнопка «Сбросить демо». Тесты запускаются без флага (tests/run.sh) -->
  <script>window.LINIYA_SYNC = true;</script>
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased overflow-hidden select-none">

  <!-- MAIN APP CONTAINER -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- ==================== LEFT SIDEBAR (240px) ==================== -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between p-4 flex-shrink-0 z-20 shadow-sm">
      <div class="flex flex-col gap-4 flex-1 min-h-0 overflow-y-auto pr-1">
        
        <!-- Platform Logo -->
        <div class="flex items-center justify-between px-2 py-1">
          <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('home')">
            <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center gap-0.5 shadow-sm">
              <span class="w-1 h-4 bg-white rounded-full"></span>
              <span class="w-1 h-5 bg-white rounded-full"></span>
              <span class="w-1 h-3.5 bg-white rounded-full"></span>
            </div>
            <span class="text-xl font-extrabold tracking-tight text-slate-900">ЛИНИЯ</span>
          </div>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 uppercase tracking-wider">v2.1</span>
        </div>

        <!-- Space Selector (SuperAdmin vs Center) -->
        <div id="spaceSelectorCard" class="bg-slate-50 border border-slate-200 rounded-xl p-2.5 flex items-center justify-between cursor-pointer hover:bg-slate-100 transition">
          <div class="truncate">
            <div id="spaceLabel" class="text-[10px] uppercase font-bold text-slate-400 tracking-wider truncate">ПРОЕКТ/ФАСТО</div>
            <div id="spaceName" class="text-xs font-bold text-slate-800 truncate">Платформа SuperAdmin</div>
          </div>
          <svg class="w-4 h-4 text-slate-400 flex-shrink-0 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        </div>

        <!-- SUPERADMIN NAVIGATION (генерируется в renderSuperNav) -->
        <div id="superadminNav" class="flex flex-col gap-1 text-[13px]"></div>

      </div>

      <!-- Bottom Profile / Support -->
      <div class="flex flex-col gap-3 pt-3 border-t border-slate-100">
        <a href="javascript:void(0)" onclick="showToast('Служба поддержки: support@liniya.tj', 'info')" class="flex items-center gap-2.5 text-xs text-slate-500 hover:text-slate-900 transition">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <span>Помощь и поддержка</span>
        </a>
        
        <!-- User Profile Card -->
        <div class="flex items-center gap-2.5 pt-1">
          <div id="userAvatar" class="w-9 h-9 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-xs flex-shrink-0">
            АК
          </div>
          <div class="leading-tight truncate">
            <div id="userName" class="text-xs font-semibold text-slate-900 truncate">Алексей К.</div>
            <div id="userRole" class="text-[10px] text-slate-400 truncate">Владелец платформы · SuperAdmin</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ==================== MAIN CONTENT AREA ==================== -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
      
      <!-- TOP GLOBAL HEADER (64px) -->
      <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between flex-shrink-0 z-10 shadow-xs">
        <!-- Breadcrumbs -->
        <div id="breadcrumbs" class="flex items-center gap-2 text-sm text-slate-500 whitespace-nowrap flex-shrink-0"></div>

        <!-- Global Search Bar -->
        <div class="flex-1 max-w-sm min-w-0 mx-6 relative">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input id="globalSearchInput" oninput="handleGlobalSearch(this.value)" type="text" placeholder="Найти учебный центр, курс или платеж..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-xs focus:outline-none focus:border-brand focus:bg-white transition">
        </div>

        <!-- Right Quick Actions -->
        <div class="flex items-center gap-4">
          <!-- Quick Screen Jumper -->
          <select id="screenJumper" onchange="switchTab(this.value)" class="text-xs bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 font-medium text-slate-700 focus:outline-none hover:bg-slate-100 cursor-pointer">
            <option value="home">Главная</option>
            <option value="centers">Все центры</option>
            <option value="center-new">Подключить центр</option>
            <option value="moderation">Модерация каталога</option>
            <option value="expiring">Истекающие подписки</option>
            <option value="churn">Риск оттока</option>
            <option value="limits">Центры у лимита</option>
            <option value="plans">Тарифы и лимиты</option>
            <option value="audit">Журнал аудита</option>
            <option value="billing">В2В-Биллинг</option>
            <option value="marketplace">Магазин методик</option>
            <option value="sms">Биллинг SMS</option>
            <option value="broadcast">Рассылки Broadcast</option>
            <option value="settings">Настройки платформы</option>
          </select>

          <a href="eduhub.html" class="px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap">Кабинет центра</a>
          <button id="resetDemoBtn" onclick="resetDemo()" class="hidden px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap">Сбросить демо</button>

          <button class="flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-100">
            <span>RU</span>
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          
          <div class="relative cursor-pointer p-1.5 rounded-lg hover:bg-slate-100 transition" onclick="showToast('У вас 4 системных уведомления', 'info')">
            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span class="w-2 h-2 rounded-full bg-brand absolute top-1 right-1"></span>
          </div>

          <div class="flex items-center gap-2.5">
            <img class="w-8 h-8 rounded-full object-cover border border-slate-200 shadow-xs" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Admin">
            <span class="text-xs font-semibold text-slate-800">Администратор</span>
          </div>
        </div>
      </header>

      <!-- VIEWPORT (Dynamic views loaded here) -->
      <div id="viewport" class="flex-1 relative overflow-hidden flex"></div>
      <div id="drawerRoot"></div>
      <div id="modalRoot"></div>
      <div id="menuRoot"></div>
    </div>
  </div>

  <!-- ==================== TOAST NOTIFICATION CONTAINER ==================== -->
  <div id="toastContainer" class="fixed bottom-6 right-6 flex flex-col gap-2 z-50 pointer-events-none"></div>

  <!-- Модули: порядок важен (ядро → компоненты → экраны → main). Классические скрипты, чтобы работало по file:// -->

  <script src="src/js/core/nav.js?v=20261123082931"></script>

  <script src="src/js/components/drawer.js?v=20261123082931"></script>
  <script src="src/js/components/modal.js?v=20261123082931"></script>
  <script src="src/js/components/menu.js?v=20261123082931"></script>
  <script src="src/js/components/pager.js?v=20261123082931"></script>
  <script src="src/js/components/dialogs.js?v=20261123082931"></script>
  <script src="src/js/components/credentials.js?v=20261123082931"></script>
  <script src="src/js/components/payments.js?v=20261123082931"></script>
  <script src="src/js/components/finance.js?v=20261123082931"></script>

  <script src="src/js/components/course-cover.js?v=20261123082931"></script>
  <script src="src/js/views/platform/home.js?v=20261123082931"></script>
  <script src="src/js/views/platform/centers.js?v=20261123082931"></script>
  <script src="src/js/views/platform/center-new.js?v=20261123082931"></script>
  <script src="src/js/views/platform/center-people.js?v=20261123082931"></script>
  <script src="src/js/views/platform/moderation.js?v=20261123082931"></script>
  <script src="src/js/views/platform/expiring.js?v=20261123082931"></script>
  <script src="src/js/views/platform/churn.js?v=20261123082931"></script>

  <script src="src/js/views/platform/sms.js?v=20261123082931"></script>
  <script src="src/js/views/shared/course-page.js?v=20261123082931"></script>
  <script src="src/js/views/platform/broadcast.js?v=20261123082931"></script>
  <script src="src/js/views/platform/settings.js?v=20261123082931"></script>
  <script src="src/js/views/platform/plans.js?v=20261123082931"></script>
  <script src="src/js/views/platform/limits.js?v=20261123082931"></script>
  <script src="src/js/views/platform/audit.js?v=20261123082931"></script>
  <script src="src/js/main.js?v=20261123082931"></script>
</body>
</html>
